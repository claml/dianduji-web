<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6fed" />
    <title>典读鸡 · Web 版</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span class="brand">典读鸡 <small>Web</small></span>
      <button id="open-btn" title="打开 PDF">打开 PDF</button>
      <input id="file-input" type="file" accept="application/pdf,.pdf,text/plain,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx" hidden />
      <span class="spacer"></span>
      <button id="zoom-out" title="缩小">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="放大">＋</button>
      <span class="sep"></span>
      <button id="prev-page" title="上一页">‹</button>
      <input id="page-input" title="页码：输入数字跳转" inputmode="numeric" />
      <button id="next-page" title="下一页">›</button>
      <span class="sep"></span>
      <button id="outline-btn" title="目录" hidden>目录</button>
      <button id="book-btn" title="生词本">生词本</button>
      <button id="settings-btn" title="设置">⚙</button>
    </header>

    <main id="viewer">
      <div id="pdf-canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
        <div id="text-layer"></div>
      </div>
      <div id="txt-view" hidden></div>
      <div id="empty-state">
        <p>打开一份 PDF 开始点读</p>
        <p class="hint">本地解析，文档不上传；点按英文单词查看释义</p>
      </div>
      <aside id="word-card" hidden>
        <div id="word-card-head">
          <span id="word-surface"></span>
          <span id="word-pos"></span>
          <button id="word-save" title="收藏到生词本">☆</button>
          <button id="word-close" title="关闭">×</button>
        </div>
        <div id="word-phonetic"></div>
        <div id="word-meaning"></div>
        <div id="word-specialized" hidden>
          <span id="word-spec-domain"></span>
          <span id="word-spec-definition"></span>
        </div>
        <div id="word-custom-def" hidden>
          <span class="ws-label">自定义释义</span>
          <span id="word-custom-def-text"></span>
        </div>
        <div id="word-sentence" hidden>
          <span class="ws-label">原文</span>
          <div id="word-sentence-text"></div>
          <div id="sentence-actions">
            <button id="sentence-translate">翻译整句</button>
            <button id="sentence-save" title="收藏到句子本">☆ 收藏句子</button>
          </div>
          <div id="sentence-translation" class="ws-translation" hidden></div>
        </div>
        <div id="word-phrase" hidden>
          <div class="phrase-row">
            <span class="ws-label">相关短语</span>
            <span id="word-phrase-type"></span>
          </div>
          <div id="word-phrase-surface"></div>
          <div id="word-phrase-meaning"></div>
          <button id="phrase-save">☆ 收藏短语</button>
        </div>
        <button id="custom-def-add" hidden>＋ 添加自定义释义</button>
        <div id="word-source" class="hint"></div>
      </aside>

      <aside id="outline-panel" hidden>
        <div id="outline-head">
          <span>目录</span>
          <button id="outline-close" title="关闭">×</button>
        </div>
        <div id="outline-list"></div>
        <div id="outline-empty" class="hint">此 PDF 没有书签目录</div>
      </aside>

      <aside id="book-panel" hidden>
        <div id="book-head">
          <span>收藏</span>
          <span id="book-tabs">
            <button id="tab-words" class="tab active">生词</button>
            <button id="tab-phrases" class="tab">句子</button>
          </span>
          <button id="book-close" title="关闭">×</button>
        </div>
        <div id="book-list"></div>
        <div id="book-empty" class="hint">还没有收藏的内容</div>
        <div id="book-footer">
          <button id="review-btn" title="复习生词">复习</button>
        </div>
      </aside>

      <div id="review-overlay" hidden>
        <div id="review-box">
          <div id="review-progress"></div>
          <div id="review-word"></div>
          <div id="review-phonetic"></div>
          <div id="review-definition" hidden></div>
          <div id="review-actions">
            <button id="review-reveal">显示释义</button>
            <button id="review-known" hidden>✓ 认识（标记已掌握）</button>
            <button id="review-retry" hidden>再学一次</button>
            <button id="review-next" hidden>下一个 ›</button>
          </div>
          <button id="review-close" title="退出复习">×</button>
        </div>
      </div>

      <div id="settings-overlay" hidden>
        <div id="settings-box">
          <h3>设置</h3>
          <label>
            在线翻译网关地址
            <input id="gateway-url" type="text" placeholder="http://127.0.0.1:8080/translate" />
          </label>
          <label class="row">
            <input id="online-enabled" type="checkbox" />
            词库未收录时尝试在线翻译
          </label>
          <label>
            主题
            <select id="theme-select">
              <option value="system">跟随系统</option>
              <option value="light">日间</option>
              <option value="dark">夜间</option>
            </select>
          </label>
          <label>
            阅读字号（TXT/DOCX）
            <select id="font-size-select">
              <option value="15">小</option>
              <option value="17">标准</option>
              <option value="20">大</option>
              <option value="24">特大</option>
            </select>
          </label>
          <label>
            行距
            <select id="line-height-select">
              <option value="1.6">紧凑</option>
              <option value="1.9">标准</option>
              <option value="2.2">宽松</option>
            </select>
          </label>
          <div id="settings-actions">
            <button id="settings-save">保存</button>
            <button id="settings-cancel">取消</button>
          </div>
        </div>
      </div>

      <div id="custom-def-overlay" hidden>
        <div id="custom-def-box">
          <h3>添加自定义释义</h3>
          <div class="cd-word" id="custom-def-word"></div>
          <textarea id="custom-def-input" rows="3" placeholder="输入这个词的语境化中文释义…"></textarea>
          <div id="settings-actions">
            <button id="custom-def-save">保存</button>
            <button id="custom-def-cancel">取消</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
